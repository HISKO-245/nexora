<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل العمل - Nexora</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  user-select: none;
}

body {
  background: #f8fafc;
  color: #1e293b;
  padding-bottom: 40px;
}

/* Top Navigation */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  background: #ffffff;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #f1f5f9;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  font-size: 16px;
  color: #64748b;
}

/* Header Info */
.hero-container {
  padding: 12px 16px;
  display: flex;
  gap: 16px;
  background: #ffffff;
}

.poster-box {
  width: 100px;
  height: 140px;
  border-radius: 12px;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

.poster-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.manga-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: right;
  flex: 1;
}

.manga-title {
  font-size: 16px;
  font-weight: 800;
  color: #0f172a;
  line-height: 1.3;
  margin-bottom: 8px;
}

.manga-sub {
  font-size: 12px;
  color: #94a3b8;
  margin-bottom: 4px;
}

/* Stats Card */
.stats-card {
  margin: 16px;
  background: #ffffff;
  border-radius: 16px;
  padding: 12px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  border: 1px solid #e2e8f0;
  text-align: center;
}

.stat-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.stat-val {
  font-size: 14px;
  font-weight: bold;
  color: #0f172a;
}

.stat-lbl {
  font-size: 11px;
  color: #94a3b8;
}

/* Action Buttons */
.action-section {
  padding: 0 16px;
  margin-bottom: 12px;
}

.read-btn {
  width: 100%;
  background: #22c55e;
  color: white;
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(34, 197, 94, 0.25);
}

.sub-actions {
  display: flex;
  gap: 10px;
  padding: 0 16px;
  margin-bottom: 20px;
}

.sub-btn {
  flex: 1;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  padding: 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  color: #10b981;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
}

/* Rating Box */
.rating-box {
  background: #ffffff;
  margin: 0 16px 20px;
  padding: 16px;
  border-radius: 16px;
  border: 1px solid #e2e8f0;
  text-align: center;
}

.rating-stars {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 8px;
  font-size: 22px;
  color: #e2e8f0;
  cursor: pointer;
}

/* Story Section */
.story-section {
  padding: 0 16px;
  margin-bottom: 20px;
}

.section-title {
  font-size: 16px;
  font-weight: bold;
  color: #0f172a;
  margin-bottom: 8px;
  text-align: right;
}

.story-text {
  font-size: 12px;
  color: #64748b;
  line-height: 1.8;
  text-align: right;
}

.tags-container {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.tag {
  background: #f1f5f9;
  color: #64748b;
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 6px;
}

/* Chapters Header */
.chapters-header {
  padding: 0 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.chapter-count {
  background: #dcfce7;
  color: #15803d;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: bold;
}

/* Chapter Card */
.chapter-item {
  margin: 0 16px 8px;
  background: #ffffff;
  border-radius: 12px;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid #e2e8f0;
  cursor: pointer;
}

.chapter-num {
  font-size: 15px;
  font-weight: bold;
  color: #0f172a;
}

.chapter-date {
  font-size: 10px;
  color: #94a3b8;
}

.chapter-icons {
  display: flex;
  gap: 12px;
  color: #94a3b8;
  font-size: 14px;
}
</style>
</head>
<body>

<!-- Top Navigation -->
<div class="top-bar">
  <button class="icon-btn" onclick="window.location.href='index.html'">✕</button>
  <div style="display: flex; gap: 8px;">
    <button class="icon-btn">♡</button>
    <button class="icon-btn" style="color: #eab308;">⚠️</button>
  </div>
</div>

<!-- Header Info -->
<div class="hero-container">
  <div class="poster-box">
    <img id="mangaPoster" src="" alt="Poster">
  </div>
  <div class="manga-info">
    <h1 class="manga-title" id="mangaTitle">عنوان العمل</h1>
    <div class="manga-sub" id="mangaStatus">مانهوا • مكتملة</div>
    <div class="manga-sub" id="mangaAuthor">الكاتب: غير معروف</div>
  </div>
</div>

<!-- Stats Card -->
<div class="stats-card">
  <div class="stat-item">
    <span class="stat-val" style="color:#eab308;" id="mangaRating">0.0 ★</span>
    <span class="stat-lbl">التقييم</span>
  </div>
  <div class="stat-item">
    <span class="stat-val">8 👁️</span>
    <span class="stat-lbl">المشاهدات</span>
  </div>
  <div class="stat-item">
    <span class="stat-val" style="color:#10b981;" id="mangaChaptersCount">17 📖</span>
    <span class="stat-lbl">الفصول</span>
  </div>
</div>

<!-- Action Button -->
<div class="action-section">
  <button class="read-btn" onclick="openReader()">
    <span>▶</span> ابدأ القراءة
  </button>
</div>

<!-- Sub Actions -->
<div class="sub-actions">
  <button class="sub-btn">💬 التعليقات</button>
  <button class="sub-btn">➕ إضافة للقائمة</button>
</div>

<!-- Rating Box -->
<div class="rating-box">
  <div style="font-size: 13px; font-weight: bold; color: #0f172a;">قيم هذا العمل</div>
  <div style="font-size: 10px; color: #94a3b8; margin-top: 2px;">اختر من 5 نجوم</div>
  <div class="rating-stars">
    <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
  </div>
</div>

<!-- Story Section -->
<div class="story-section">
  <div class="section-title">القصة</div>
  <p class="story-text" id="mangaDesc">جاري تحميل القصة...</p>
  <div class="tags-container">
    <span class="tag">أكشن</span>
    <span class="tag">إثارة</span>
    <span class="tag">فانتازيا</span>
    <span class="tag">قوى خارقة</span>
  </div>
</div>

<!-- Chapters Header -->
<div class="chapters-header">
  <div class="section-title" style="margin: 0;">الفصول المتوفرة</div>
  <span class="chapter-count" id="badgeCount">17 فصل</span>
</div>

<!-- Chapter List -->
<div id="chaptersContainer"></div>

<script>
let currentData = null;

document.addEventListener('DOMContentLoaded', () => {
  const data = localStorage.getItem('selected_manga');
  if (data) {
    currentData = JSON.parse(data);
    
    document.getElementById('mangaTitle').innerText = currentData.title || "عنوان غير معروف";
    document.getElementById('mangaPoster').src = currentData.poster || "https://via.placeholder.com/100x140";
    document.getElementById('mangaStatus').innerText = currentData.status || "مانهوا • مكتملة";
    document.getElementById('mangaRating').innerText = (currentData.rating || "5.0") + " ★";
    document.getElementById('mangaDesc').innerText = currentData.desc || "لا يوجد وصف متوفر لهذا العمل.";
    
    renderChapters();
  }
});

function renderChapters() {
  const container = document.getElementById('chaptersContainer');
  container.innerHTML = '';
  
  const totalChapters = 17; 
  document.getElementById('mangaChaptersCount').innerText = totalChapters + " 📖";
  document.getElementById('badgeCount').innerText = totalChapters + " فصل";

  for (let i = totalChapters; i >= 1; i--) {
    const item = document.createElement('div');
    item.className = 'chapter-item';
    item.onclick = () => openReader();
    item.innerHTML = `
      <div class="chapter-icons">
        <span>👁️</span>
        <span>📥</span>
        <span>💬</span>
      </div>
      <div style="text-align: left;">
        <div class="chapter-num">${i}</div>
        <div class="chapter-date">2026-09-02</div>
      </div>
    `;
    container.appendChild(item);
  }
}

function openReader() {
  window.location.href = 'reader.html';
}
</script>

</body>
    </html>
