<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora - تفاصيل العمل</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  user-select: none;
}

body {
  background: #09090e;
  color: #efefef;
  padding: 16px;
  padding-bottom: 40px;
}

/* Top Navigation Bar inside details */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.icon-btn {
  background: #161622;
  border: 1px solid #222232;
  color: #efefef;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
}

.icon-btn:active { transform: scale(0.95); }

/* Header Info Section */
.info-section {
  display: flex;
  gap: 16px;
  background: #12121c;
  border: 1px solid #222232;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
  align-items: center;
}

.poster-box {
  width: 105px;
  aspect-ratio: 2/3;
  border-radius: 10px;
  overflow: hidden;
  background: #1c1c2b;
  flex-shrink: 0;
}

.poster-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.details-text h1 {
  font-size: 18px;
  color: #fff;
  margin-bottom: 6px;
}

.details-text p {
  font-size: 12px;
  color: #a1a1aa;
  margin-bottom: 4px;
}

/* Stats Row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  background: #12121c;
  border: 1px solid #222232;
  border-radius: 16px;
  padding: 14px;
  text-align: center;
  margin-bottom: 16px;
}

.stat-item .number {
  font-size: 15px;
  font-weight: bold;
  color: #fff;
  margin-bottom: 2px;
}

.stat-item .label {
  font-size: 11px;
  color: #71717a;
}

/* Action Buttons */
.main-read-btn {
  width: 100%;
  background: #8b5cf6;
  color: white;
  border: none;
  padding: 14px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  margin-bottom: 12px;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
}

.main-read-btn:active { transform: scale(0.98); }

.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}

.sub-btn {
  background: #12121c;
  border: 1px solid #222232;
  color: #efefef;
  padding: 12px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
}

.sub-btn:active { transform: scale(0.98); }

/* Rating Box */
.section-box {
  background: #12121c;
  border: 1px solid #222232;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}

.section-box h3 {
  font-size: 14px;
  color: #fff;
  margin-bottom: 10px;
  text-align: right;
}

.stars-container {
  display: flex;
  justify-content: center;
  gap: 8px;
  font-size: 22px;
  color: #3f3f46;
  cursor: pointer;
}

.stars-container span.active { color: #facc15; }

/* Story Description */
.story-desc {
  font-size: 13px;
  color: #a1a1aa;
  line-height: 1.6;
  text-align: right;
}

/* Chapters List */
.chapter-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #161622;
  border: 1px solid #222232;
  padding: 12px 14px;
  border-radius: 12px;
  margin-top: 8px;
  cursor: pointer;
}

.chapter-item:active { background: #1c1c2b; }
.chapter-info h4 { font-size: 13px; color: #fff; margin-bottom: 2px; }
.chapter-info span { font-size: 11px; color: #71717a; }
</style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="icon-btn" onclick="goBack()" title="رجوع">✕</div>
    <div style="display: flex; gap: 8px;">
      <div class="icon-btn" onclick="alert('تمت الإضافة للمفضلة ♡')" title="مفضلة">♡</div>
      <div class="icon-btn" onclick="alert('تنبيهات العمل مفعلة')" title="تنبيه">🔔</div>
    </div>
  </div>

  <!-- Header Info -->
  <div class="info-section">
    <div class="poster-box">
      <img id="itemPoster" src="" alt="Poster">
    </div>
    <div class="details-text">
      <h1 id="itemTitle">جاري التحميل...</h1>
      <p id="itemStatus">...</p>
      <p>الكاتب: غير معروف</p>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-item">
      <div class="number">1</div>
      <div class="label">الفصول</div>
    </div>
    <div class="stat-item">
      <div class="number">14</div>
      <div class="label">المشاهدات</div>
    </div>
    <div class="stat-item">
      <div class="number" style="color: #facc15;">★ 5.0</div>
      <div class="label">التقييم</div>
    </div>
  </div>

  <!-- Main Read Button -->
  <button class="main-read-btn" onclick="openMediaLink()">
    <span>▶ ابدأ القراءة / المشاهدة</span>
  </button>

  <!-- Action Buttons -->
  <div class="action-row">
    <button class="sub-btn" onclick="alert('تمت الإضافة لقائمتك الخاصة')">＋ إضافة للقائمة</button>
    <button class="sub-btn" onclick="alert('لا توجد تعليقات حالياً')">💬 التعليقات</button>
  </div>

  <!-- Rating Box -->
  <div class="section-box" style="text-align: center;">
    <h3>قيم هذا العمل</h3>
    <p style="font-size: 11px; color: #71717a; margin-bottom: 8px;">اختر من 5 نجوم</p>
    <div class="stars-container">
      <span onclick="rate(1)">★</span>
      <span onclick="rate(2)">★</span>
      <span onclick="rate(3)">★</span>
      <span onclick="rate(4)">★</span>
      <span onclick="rate(5)" class="active">★</span>
    </div>
  </div>

  <!-- Story / Desc -->
  <div class="section-box">
    <h3>القصة</h3>
    <p class="story-desc" id="itemDesc">لا يوجد وصف متاح.</p>
  </div>

  <!-- Chapters -->
  <div class="section-box">
    <h3>الفصول المتوفرة</h3>
    <div class="chapter-item" onclick="openMediaLink()">
      <div class="chapter-info">
        <h4 id="chapTitle">الفصل 1</h4>
        <span id="chapDate">2026-09-04</span>
      </div>
      <span style="color: #8b5cf6; font-size: 12px; font-weight: bold;">قراءة ←</span>
    </div>
  </div>

<script>
let currentData = JSON.parse(localStorage.getItem('selected_manga'));

document.addEventListener('DOMContentLoaded', () => {
  if (currentData) {
    document.getElementById('itemTitle').innerText = currentData.title || "عنوان العمل";
    document.getElementById('itemStatus').innerText = currentData.status || "مانهوا • مكتملة";
    document.getElementById('itemPoster').src = currentData.poster || "https://via.placeholder.com/200x300";
    document.getElementById('itemDesc').innerText = currentData.desc || "لا يوجد وصف متاح.";
  }
});

function openMediaLink() {
  if (currentData && currentData.videoUrl) {
    window.location.href = currentData.videoUrl;
  } else {
    alert("عذراً، لم يتم إدراج رابط تشغيل لهذا العمل. يمكنك إضافته من لوحة الإدارة.");
  }
}

function goBack() {
  window.location.href = 'index.html';
}

function rate(stars) {
  alert("شكراً لك! تم تسجيل تقييمك (" + stars + " نجوم) بنجاح ⭐");
  const starElements = document.querySelectorAll('.stars-container span');
  starElements.forEach((el, index) => {
    if (index < stars) el.classList.add('active');
    else el.classList.remove('active');
  });
}
</script>
</body>
</html>
