<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5cf6">
<title>Nexora - الرئيسية</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  user-select: none;
}

body {
  background: #09090e;
  color: #efefef;
  padding-bottom: 90px;
}

/* Top Bar */
.top-bar {
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #09090e;
  position: sticky;
  top: 0;
  z-index: 90;
}

.top-icons {
  display: flex;
  gap: 10px;
  align-items: center;
}

.icon-btn {
  background: #161622;
  border: 1px solid #222232;
  color: #fff;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  cursor: pointer;
}

.vip-coin {
  background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%);
  color: #000;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 4px;
}

.page-title {
  font-size: 18px;
  font-weight: bold;
  color: #fff;
}

/* Hero Slider Banner */
.hero-slider {
  padding: 12px 16px;
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.hero-slider::-webkit-scrollbar { display: none; }

.hero-card {
  min-width: 280px;
  height: 160px;
  background: #12121c;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  border: 1px solid #222232;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 14px;
  background-size: cover;
  background-position: center;
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(9,9,14,0.95) 10%, rgba(9,9,14,0.3) 100%);
}

.hero-content {
  position: relative;
  z-index: 2;
}

.hero-content h3 {
  font-size: 15px;
  color: #fff;
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.read-now-btn {
  background: #8b5cf6;
  color: white;
  border: none;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* Section Headers */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 16px 8px;
}

.section-header h2 {
  font-size: 15px;
  color: #fff;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 6px;
}

.see-all {
  font-size: 11px;
  color: #8b5cf6;
  cursor: pointer;
  background: none;
  border: none;
}

/* Horizontal Cards Grid (New & Completed) */
.horizontal-scroll {
  display: flex;
  gap: 12px;
  padding: 0 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.horizontal-scroll::-webkit-scrollbar { display: none; }

.manga-mini-card {
  min-width: 120px;
  max-width: 120px;
  background: #12121c;
  border-radius: 12px;
  border: 1px solid #222232;
  overflow: hidden;
  flex-shrink: 0;
  cursor: pointer;
}

.mini-poster {
  width: 100%;
  aspect-ratio: 2/3;
  position: relative;
  background: #1c1c2b;
}

.mini-poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.tag-badge {
  position: absolute;
  top: 6px;
  right: 6px;
  background: #8b5cf6;
  color: white;
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: bold;
}

.mini-details {
  padding: 8px;
}
.mini-details h4 {
  font-size: 11px;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}
.mini-details p {
  font-size: 9px;
  color: #a1a1aa;
}

/* Tab Views */
.tab-content { display: none; }
.tab-content.active { display: block; }

/* BOTTOM NAVIGATION BAR (FIXED) */
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: #11111a !important;
  border-top: 1px solid #1e1e2d;
  display: flex !important;
  justify-content: space-around;
  align-items: center;
  z-index: 9999 !important;
}

.nav-link {
  display: flex !important;
  flex-direction: column;
  align-items: center;
  color: #71717a;
  font-size: 10px;
  gap: 3px;
  cursor: pointer;
  width: 25%;
  background: transparent;
  border: none;
}
.nav-link.active { color: #8b5cf6; font-weight: bold; }
.nav-link .icon { font-size: 18px; padding: 2px 12px; border-radius: 12px; }
.nav-link.active .icon { background: rgba(139, 92, 246, 0.2); }
</style>
</head>

<body>

<!-- TAB 1: الرئيسية -->
<div id="tabHome" class="tab-content active">
  
  <!-- شريط العلوي -->
  <div class="top-bar">
    <div class="top-icons">
      <div class="icon-btn" onclick="alert('لا توجد إشعارات جديدة في Nexora')">🔔</div>
      <div class="icon-btn" onclick="switchTab('tabSearch', document.querySelectorAll('.nav-link')[2])">🔍</div>
      <div class="vip-coin">💎 20%-</div>
    </div>
    <div class="page-title">Nexora</div>
  </div>

  <!-- السلايدر البارز في الأعلى -->
  <div class="hero-slider">
    <div class="hero-card" style="background-image: url('https://via.placeholder.com/400x200/1c1c2b/8b5cf6?text=Streamer');">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h3>Streamer (مستمر • 9.0 ★)</h3>
        <button class="read-now-btn" onclick="alert('جاري فتح الفصول في Nexora...')">اقرأ الآن ➔</button>
      </div>
    </div>
    <div class="hero-card" style="background-image: url('https://via.placeholder.com/400x200/1c1c2b/8b5cf6?text=Demonic+Emperor');">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h3>Demonic Emperor (مستمر • 9.6 ★)</h3>
        <button class="read-now-btn" onclick="alert('جاري فتح الفصول في Nexora...')">اقرأ الآن ➔</button>
      </div>
    </div>
  </div>

  <!-- قسم أعمال جديدة -->
  <div class="section-header">
    <button class="see-all" onclick="alert('عرض كل الأعمال الجديدة')">عرض الكل ‹</button>
    <h2>✨ أعمال جديدة</h2>
  </div>
  <div class="horizontal-scroll" id="newReleasesGrid"></div>

  <!-- قسم أعمال مكتملة -->
  <div class="section-header">
    <button class="see-all" onclick="alert('عرض كل الأعمال المكتملة')">عرض الكل ‹</button>
    <h2>✅ أعمال مكتملة</h2>
  </div>
  <div class="horizontal-scroll" id="completedGrid"></div>

  <!-- قسم الأعلى تقييماً -->
  <div class="section-header">
    <button class="see-all" onclick="alert('عرض كل القائمة')">عرض الكل ‹</button>
    <h2>⭐ الأعلى تقييماً</h2>
  </div>
  <div class="horizontal-scroll" id="topRatedGrid"></div>

</div>

<!-- TAB 2: البحث -->
<div id="tabSearch" class="tab-content">
  <div style="padding: 40px; text-align: center; color: #a1a1aa;">
    <h3>محرك البحث في Nexora</h3>
  </div>
</div>

<!-- TAB 3: التنزيلات -->
<div id="tabHistory" class="tab-content">
  <div style="padding: 40px; text-align: center; color: #a1a1aa;">
    <h3>الفصول المحملة دون اتصال في Nexora</h3>
  </div>
</div>

<!-- TAB 4: المجتمع -->
<div id="tabMore" class="tab-content">
  <div style="padding: 40px; text-align: center; color: #a1a1aa;">
    <h3>مجتمع Nexora</h3>
  </div>
</div>

<!-- BOTTOM NAVIGATION BAR (FIXED) -->
<nav>
  <button class="nav-link" onclick="switchTab('tabMore', this)"><span class="icon">👥</span>المجتمع</button>
  <button class="nav-link" onclick="switchTab('tabHistory', this)"><span class="icon">📥</span>التنزيلات</button>
  <button class="nav-link" onclick="switchTab('tabSearch', this)"><span class="icon">🔍</span>البحث</button>
  <button class="nav-link active" onclick="switchTab('tabHome', this)"><span class="icon">🏠</span>الرئيسية</button>
</nav>

<script>
const mockData = [
  { id: 1, title: "The Genius Streamer", type: "مستمر", rating: "9.0", poster: "https://via.placeholder.com/200x300/1c1c2b/8b5cf6?text=Streamer", category: "new" },
  { id: 2, title: "Baby Sprout", type: "مستمر", rating: "6.0", poster: "https://via.placeholder.com/200x300/1c1c2b/8b5cf6?text=Baby+Sprout", category: "new" },
  { id: 3, title: "Blinded by Setting Sun", type: "مكتمل", rating: "8.1", poster: "https://via.placeholder.com/200x300/1c1c2b/8b5cf6?text=Blinded", category: "completed" },
  { id: 4, title: "Komi-san", type: "مكتمل", rating: "7.0", poster: "https://via.placeholder.com/200x300/1c1c2b/8b5cf6?text=Komi", category: "completed" },
  { id: 5, title: "Demonic Emperor", type: "مستمر", rating: "9.6", poster: "https://via.placeholder.com/200x300/1c1c2b/8b5cf6?text=Demonic", category: "top" },
  { id: 6, title: "Northern Blade", type: "مكتمل", rating: "9.6", poster: "https://via.placeholder.com/200x300/1c1c2b/8b5cf6?text=Blade", category: "top" }
];

document.addEventListener('DOMContentLoaded', () => {
  renderSections();
});

function switchTab(tabId, el) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  if (el) el.classList.add('active');
}

function renderSections() {
  const newContainer = document.getElementById('newReleasesGrid');
  const compContainer = document.getElementById('completedGrid');
  const topContainer = document.getElementById('topRatedGrid');

  newContainer.innerHTML = '';
  compContainer.innerHTML = '';
  topContainer.innerHTML = '';

  mockData.forEach(item => {
    const cardHTML = `
      <div class="manga-mini-card" onclick="alert('فتح تفاصيل: ${item.title}')">
        <div class="mini-poster">
          <img src="${item.poster}" alt="cover">
          <span class="tag-badge">${item.type}</span>
        </div>
        <div class="mini-details">
          <h4>${item.title}</h4>
          <p>★ ${item.rating}</p>
        </div>
      </div>
    `;

    if(item.category === 'new') newContainer.innerHTML += cardHTML;
    if(item.category === 'completed') compContainer.innerHTML += cardHTML;
    if(item.category === 'top') topContainer.innerHTML += cardHTML;
  });
}
</script>

</body>
</html>
