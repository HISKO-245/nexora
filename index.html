<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5cf6">
<title>Nexora - عالمك الترفيهي</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0b0b12;
  color: white;
  padding-bottom: 80px;
}

header {
  padding: 22px 18px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 26px;
  font-weight: bold;
}

.logo span {
  color: #8b5cf6;
}

.search {
  margin: 15px 16px;
  height: 50px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  background: #15151f;
  border: 1px solid rgba(139, 92, 246, 0.25);
  border-radius: 16px;
}

.search input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 14px;
}

.hero {
  margin: 0 16px 20px;
  height: 160px;
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background: linear-gradient(to top, rgba(11,11,18,0.9), rgba(11,11,18,0.2)),
              url('nexora-bg.png') center/cover #1e1e2d;
}

.categories {
  display: flex;
  gap: 10px;
  padding: 5px 16px 20px;
  overflow-x: auto;
  scrollbar-width: none;
}

.categories button {
  flex-shrink: 0;
  padding: 10px 18px;
  border: 1px solid rgba(139,92,246,0.35);
  border-radius: 14px;
  background: #15151f;
  color: #ddd;
  cursor: pointer;
  transition: 0.2s ease;
}

.categories button.active,
.categories button:hover {
  background: #8b5cf6;
  color: white;
  border-color: #8b5cf6;
}

.section {
  padding: 0 16px;
  margin-bottom: 25px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  margin-bottom: 13px;
}

.cards {
  display: flex;
  gap: 12px;
  overflow-x: auto;
}

.card {
  min-width: 145px;
  background: #151522;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(139,92,246,0.2);
  display: flex;
  flex-direction: column;
}

.cover {
  height: 170px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 50px;
  background: #24143f;
}

.card-info {
  padding: 10px;
}

.card-info h3 {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.watch-btn {
  display: block;
  text-align: center;
  margin-top: 8px;
  padding: 6px;
  background: #8b5cf6;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-size: 12px;
}

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: #12121b;
  border-top: 1px solid #272735;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

nav div {
  text-align: center;
  color: #777;
  font-size: 12px;
  cursor: pointer;
}

nav .active {
  color: #9b7cff;
}
</style>
</head>

<body>

<header>
  <div class="logo">Nexo<span>ra</span></div>
  <div>🔔</div>
</header>

<div class="search">
  <span>🔍</span>
  <input type="text" id="searchInput" placeholder="ابحث في Nexora...">
</div>

<section class="hero">
  <h1>عالم Nexora الترفيهي</h1>
  <p>مانجا، أنمي، أفلام وتنمية ذاتية في مكان واحد.</p>
</section>

<!-- أزرار التصنيفات -->
<section class="categories">
  <button class="cat-btn active" data-cat="all">🌐 الكل</button>
  <button class="cat-btn" data-cat="manga">📚 مانجا ومانهوا</button>
  <button class="cat-btn" data-cat="anime">🎌 أنمي</button>
  <button class="cat-btn" data-cat="movie">🎬 أفلام</button>
  <button class="cat-btn" data-cat="dev">🧠 تنمية ذاتية</button>
</section>

<!-- المحتوى -->
<section class="section">
  <div class="section-title">
    <h2>🔥 العروض المتاحة</h2>
  </div>

  <div class="cards" id="cardsContainer">

    <div class="card" data-category="manga">
      <div class="cover">📖</div>
      <div class="card-info">
        <h3>Solo Leveling</h3>
        <a href="watch.html?title=Solo%20Leveling&type=manga" class="watch-btn">📖 اقرأ الآن</a>
      </div>
    </div>

    <div class="card" data-category="anime">
      <div class="cover">🍿</div>
      <div class="card-info">
        <h3>Demon Slayer</h3>
        <a href="watch.html?title=Demon%20Slayer&type=anime" class="watch-btn">▶️ شاهد الآن</a>
      </div>
    </div>

    <div class="card" data-category="movie">
      <div class="cover">🎥</div>
      <div class="card-info">
        <h3>Inception</h3>
        <a href="watch.html?title=Inception&type=movie" class="watch-btn">▶️ شاهد الآن</a>
      </div>
    </div>

    <div class="card" data-category="dev">
      <div class="cover">💡</div>
      <div class="card-info">
        <h3>ملخص كتاب العادات الذرية</h3>
        <a href="watch.html?title=العادات%20الذرية&type=dev" class="watch-btn">🧠 اقرأ/استمع</a>
      </div>
    </div>

  </div>
</section>

<nav>
  <div class="active"><span class="icon">🏠</span>الرئيسية</div>
  <div><span class="icon">🔍</span>بحث</div>
  <div><span class="icon">❤️</span>المفضلة</div>
  <div><span class="icon">👤</span>حسابي</div>
</nav>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const searchInput = document.getElementById("searchInput");
  const catButtons = document.querySelectorAll(".cat-btn");
  const cards = document.querySelectorAll(".card");

  // الفلترة بالتصنيفات
  catButtons.forEach(btn => {
    btn.addEventListener("click", function() {
      catButtons.forEach(b => b.classList.remove("active"));
      this.classList.add("active");

      const category = this.getAttribute("data-cat");
      filterContent(category, searchInput.value.trim().toLowerCase());
    });
  });

  // الفلترة بالبحث
  searchInput.addEventListener("input", function() {
    const activeCat = document.querySelector(".cat-btn.active").getAttribute("data-cat");
    filterContent(activeCat, this.value.trim().toLowerCase());
  });

  function filterContent(category, searchText) {
    cards.forEach(card => {
      const cardCat = card.getAttribute("data-category");
      const title = card.querySelector("h3").textContent.toLowerCase();

      const matchesCat = (category === "all" || cardCat === category);
      const matchesSearch = (searchText === "" || title.includes(searchText));

      if (matchesCat && matchesSearch) {
        card.style.display = "flex";
      } else {
        card.style.display = "none";
      }
    });
  }
});
</script>

</body>
</html>
