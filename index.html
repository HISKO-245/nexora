<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5cf6">
<title>Nexora - Star Edition</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  user-select: none;
}

body {
  background: #09090e;
  color: #efefef;
  padding-bottom: 75px;
}

header {
  padding: 15px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #11111a;
  position: sticky;
  top: 0;
  z-index: 90;
  border-bottom: 1px solid rgba(139, 92, 246, 0.2);
}

.logo {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 1px;
}

.logo span {
  color: #8b5cf6;
}

.admin-btn {
  background: linear-gradient(135deg, #8b5cf6, #6d28d9);
  border: none;
  color: white;
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
}

.search-container {
  padding: 12px 16px;
}

.search-box {
  height: 45px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  background: #161622;
  border: 1px solid #27273a;
  border-radius: 12px;
}

.search-box input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 13px;
}

.categories {
  display: flex;
  gap: 8px;
  padding: 0 16px 15px;
  overflow-x: auto;
  scrollbar-width: none;
}

.categories::-webkit-scrollbar { display: none; }

.cat-chip {
  flex-shrink: 0;
  padding: 8px 16px;
  border: 1px solid #27273a;
  border-radius: 20px;
  background: #161622;
  color: #aaa;
  font-size: 12px;
  cursor: pointer;
}

.cat-chip.active {
  background: #8b5cf6;
  color: white;
  border-color: #8b5cf6;
  font-weight: bold;
}

.content-section {
  padding: 0 16px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.section-header h2 {
  font-size: 16px;
  border-right: 3px solid #8b5cf6;
  padding-right: 8px;
}

.media-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
  gap: 12px;
}

.star-card {
  background: #12121c;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #222235;
  display: flex;
  flex-direction: column;
  position: relative;
  cursor: pointer;
}

.poster-wrapper {
  width: 100%;
  aspect-ratio: 2 / 3;
  background: #1c1c2b;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.poster-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.badge-type {
  position: absolute;
  top: 6px;
  right: 6px;
  background: rgba(0, 0, 0, 0.75);
  color: #8b5cf6;
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: bold;
}

.badge-rating {
  position: absolute;
  bottom: 6px;
  left: 6px;
  background: rgba(0, 0, 0, 0.8);
  color: #facc15;
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 4px;
  font-weight: bold;
}

.card-details {
  padding: 8px;
}

.card-details h3 {
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.full-panel {
  display: none;
  position: fixed;
  inset: 0;
  background: #09090e;
  z-index: 1000;
  overflow-y: auto;
  padding: 20px 16px;
}

.full-panel.active { display: block; }

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 12px;
  color: #aaa;
  margin-bottom: 6px;
}

.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 10px;
  background: #161622;
  border: 1px solid #27273a;
  border-radius: 8px;
  color: white;
  outline: none;
  font-size: 13px;
}

.btn-primary {
  width: 100%;
  background: #8b5cf6;
  color: white;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.btn-danger {
  background: #ef4444;
  color: white;
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
}

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: #11111a;
  border-top: 1px solid #222235;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

.nav-link {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #6b7280;
  font-size: 10px;
  gap: 3px;
  cursor: pointer;
}

.nav-link.active { color: #8b5cf6; font-weight: bold; }
.nav-link .icon { font-size: 18px; }
</style>
</head>

<body>

<header>
  <div class="logo">Nexo<span>ra</span></div>
  <button class="admin-btn" onclick="openPanel('adminPanel')">⚙️ لوحة التحكم</button>
</header>

<div class="search-container">
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="ابحث عن مانجا، أنمي، أفلام...">
  </div>
</div>

<div class="categories">
  <div class="cat-chip active" onclick="filterCategory('all', this)">⚡ الكل</div>
  <div class="cat-chip" onclick="filterCategory('manga', this)">📚 مانجا/مانهوا</div>
  <div class="cat-chip" onclick="filterCategory('anime', this)">🎌 أنمي</div>
  <div class="cat-chip" onclick="filterCategory('movie', this)">🎬 أفلام</div>
  <div class="cat-chip" onclick="filterCategory('dev', this)">🧠 تنمية ذاتية</div>
</div>

<section class="content-section">
  <div class="section-header">
    <h2>أحدث العروض</h2>
  </div>
  <div class="media-grid" id="mediaGrid"></div>
</section>

<!-- لوحة إضافة محتوى جديد -->
<div class="full-panel" id="adminPanel">
  <div class="panel-header">
    <h3>إضافة عمل جديد (Admin)</h3>
    <button class="btn-danger" onclick="closePanel('adminPanel')">إغلاق ✕</button>
  </div>
  
  <div class="form-group">
    <label>عنوان العمل</label>
    <input type="text" id="addTitle" placeholder="مثال: Solo Leveling">
  </div>

  <div class="form-group">
    <label>التصنيف</label>
    <select id="addCategory">
      <option value="manga">📚 مانجا / مانهوا</option>
      <option value="anime">🎌 أنمي</option>
      <option value="movie">🎬 فيلم / مسلسل</option>
      <option value="dev">🧠 تنمية ذاتية</option>
    </select>
  </div>

  <div class="form-group">
    <label>رابط غلاف العمل (Poster URL)</label>
    <input type="text" id="addPoster" placeholder="https://...">
  </div>

  <div class="form-group">
    <label>التقييم</label>
    <input type="text" id="addRating" placeholder="9.5">
  </div>

  <div class="form-group">
    <label>المحتوى (روابط صور المانجا تفصل بينها فاصلة `,` | أو رابط فيديو Embed للأنمي/الفيلم)</label>
    <textarea id="addSource" rows="4" placeholder="للمانجا: url1, url2 &#10;للأنمي/الفيلم: https://www.youtube.com/embed/..."></textarea>
  </div>

  <button class="btn-primary" onclick="saveNewContent()">حفظ ونشر العمل</button>
</div>

<nav>
  <div class="nav-link active"><span class="icon">🏠</span>الرئيسية</div>
  <div class="nav-link"><span class="icon">🔥</span>الشائع</div>
  <div class="nav-link"><span class="icon">⭐</span>المفضلة</div>
  <div class="nav-link"><span class="icon">👤</span>حسابي</div>
</nav>

<script>
const initialData = [
  {
    id: 1,
    title: "Solo Leveling",
    category: "manga",
    poster: "https://via.placeholder.com/200x300/1c1c2b/8b5cf6?text=Solo+Leveling",
    rating: "9.8",
    source: "https://via.placeholder.com/600x900/11111a/ffffff?text=Page+1,https://via.placeholder.com/600x900/1c1c2b/ffffff?text=Page+2"
  },
  {
    id: 2,
    title: "Demon Slayer",
    category: "anime",
    poster: "https://via.placeholder.com/200x300/1c1c2b/8b5cf6?text=Demon+Slayer",
    rating: "9.5",
    source: "https://www.youtube.com/embed/dQw4w9WgXcQ"
  }
];

let appData = JSON.parse(localStorage.getItem('nexora_db')) || initialData;
let activeCat = 'all';

function renderGrid() {
  const grid = document.getElementById('mediaGrid');
  const search = document.getElementById('searchInput').value.toLowerCase();
  grid.innerHTML = '';

  appData.forEach(item => {
    const matchCat = activeCat === 'all' || item.category === activeCat;
    const matchSearch = item.title.toLowerCase().includes(search);

    if (matchCat && matchSearch) {
      const card = document.createElement('div');
      card.className = 'star-card';
      card.onclick = () => openMedia(item);

      card.innerHTML = `
        <div class="poster-wrapper">
          <img src="${item.poster}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200x300/1c1c2b/ffffff?text=No+Cover'">
          <span class="badge-type">${getTypeLabel(item.category)}</span>
          <span class="badge-rating">★ ${item.rating}</span>
        </div>
        <div class="card-details">
          <h3>${item.title}</h3>
        </div>
      `;
      grid.appendChild(card);
    }
  });
}

function getTypeLabel(cat) {
  switch(cat) {
    case 'manga': return 'مانجا';
    case 'anime': return 'أنمي';
    case 'movie': return 'فيلم';
    case 'dev': return 'تنمية';
    default: return 'عرض';
  }
}

function filterCategory(cat, el) {
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeCat = cat;
  renderGrid();
}

function openMedia(item) {
  localStorage.setItem('nexora_current_item', JSON.stringify(item));
  if (item.category === 'manga') {
    window.location.href = `reader.html?id=${item.id}`;
  } else {
    window.location.href = `watch.html?id=${item.id}`;
  }
}

function saveNewContent() {
  const title = document.getElementById('addTitle').value.trim();
  const category = document.getElementById('addCategory').value;
  const poster = document.getElementById('addPoster').value.trim();
  const rating = document.getElementById('addRating').value.trim();
  const source = document.getElementById('addSource').value.trim();

  if (!title || !source) {
    alert('يرجى كتابة عنوان العمل والمحتوى');
    return;
  }

  const newItem = {
    id: Date.now(),
    title,
    category,
    poster: poster || 'https://via.placeholder.com/200x300/1c1c2b/ffffff?text=Cover',
    rating: rating || '8.5',
    source
  };

  appData.unshift(newItem);
  localStorage.setItem('nexora_db', JSON.stringify(appData));
  renderGrid();
  closePanel('adminPanel');
}

function openPanel(id) { document.getElementById(id).classList.add('active'); }
function closePanel(id) { document.getElementById(id).classList.remove('active'); }

document.getElementById('searchInput').addEventListener('input', renderGrid);
document.addEventListener('DOMContentLoaded', renderGrid);
</script>

</body>
</html>
