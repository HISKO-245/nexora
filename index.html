<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora - تدفق الأفلام والأنمي</title>
<style>
:root {
  --primary: #8b5cf6;
  --bg-main: #000000;
  --text-main: #ffffff;
  --text-muted: #a1a1aa;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; }

/* TikTok Style Vertical Feed Container */
.feed-container { height: calc(100vh - 60px); overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
.feed-container::-webkit-scrollbar { display: none; }

.feed-item { height: calc(100vh - 60px); scroll-snap-align: start; position: relative; background: #111; display: flex; align-items: center; justify-content: center; }
.feed-item video, .feed-item img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }

/* Video Overlay Info */
.feed-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%, rgba(0,0,0,0.3) 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 70px 20px 20px; text-align: right; pointer-events: none; }
.feed-overlay * { pointer-events: auto; }
.feed-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
.feed-desc { font-size: 12px; color: #e4e4e7; margin-bottom: 10px; line-height: 1.4; }
.feed-badge { display: inline-block; background: rgba(139, 92, 246, 0.6); backdrop-filter: blur(4px); padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; margin-bottom: 8px; width: max-content; }

/* Right Action Buttons (TikTok Style) */
.right-actions { position: absolute; bottom: 80px; left: 12px; display: flex; flex-direction: column; gap: 16px; align-items: center; z-index: 10; }
.action-btn-item { background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; transition: 0.2s; }
.action-btn-item:active { transform: scale(0.9); }
.action-btn-item span { font-size: 9px; margin-top: 2px; }
.action-btn-item.liked { color: #ef4444; }

/* Top Header Bar */
.top-nav-bar { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); display: flex; justify-content: center; align-items: center; z-index: 100; font-weight: bold; font-size: 16px; color: var(--primary); letter-spacing: 1px; }

/* Bottom Navigation Bar */
.bottom-nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
.b-nav-btn { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; font-size: 10px; gap: 3px; cursor: pointer; width: 25%; }
.b-nav-btn.active { color: var(--primary); font-weight: bold; }
.b-nav-btn .ico { font-size: 18px; }

/* Admin & Profile Modal Panels */
.panel-screen { position: fixed; inset: 0; background: #0b0b10; z-index: 1000; display: none; flex-direction: column; padding: 20px; overflow-y: auto; text-align: right; }
.panel-screen h2 { font-size: 16px; color: #fff; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.form-group-box { margin-bottom: 12px; }
.form-group-box label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.form-group-box input, .form-group-box textarea { width: 100%; background: #181824; border: 1px solid #27273a; border-radius: 8px; padding: 10px; color: #fff; font-size: 12px; text-align: right; outline: none; }
.submit-admin-btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 10px; }
.close-panel-btn { background: #27273a; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }

/* Toast Alert Message */
#toastAlert { position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%) translateY(50px); background: #1e1b4b; border: 1px solid var(--primary); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 11px; z-index: 2000; opacity: 0; transition: 0.3s; pointer-events: none; }
#toastAlert.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="top-nav-bar">Nexora • ريلز الأفلام</div>

<!-- TIKTOK STYLE VERTICAL FEED -->
<div class="feed-container" id="videoFeedContainer"></div>

<!-- ADMIN PANEL SCREEN -->
<div class="panel-screen" id="adminPanel">
  <h2><span>🛡️ لوحة إدارة الفيديوهات والأفلام</span> <button class="close-panel-btn" onclick="toggleAdminPanel(false)">إغلاق ✕</button></h2>
  <div class="form-group-box">
    <label>عنوان العمل أو الفيلم</label>
    <input type="text" id="admTitle" placeholder="مثال: Suzume Movie Edit">
  </div>
  <div class="form-group-box">
    <label>وصف الفيديو</label>
    <textarea id="admDesc" rows="3" placeholder="اكتب وصف قصير أو قصة اللقطة..."></textarea>
  </div>
  <div class="form-group-box">
    <label>رابط الفيديو المباشر (MP4 URL)</label>
    <input type="text" id="admVideoUrl" placeholder="ضع رابط فيديو مباشر هنا">
  </div>
  <div class="form-group-box">
    <label>رابط صورة الغلاف (إذا لم يتوفر فيديو)</label>
    <input type="text" id="admPosterUrl" placeholder="رابط صورة الغلاف">
  </div>
  <button class="submit-admin-btn" onclick="addNewFeedItem()">نشر العمل الآن في تيار Nexora 🚀</button>
</div>

<!-- BOTTOM NAVIGATION BAR -->
<nav class="bottom-nav-bar">
  <button class="b-nav-btn active" onclick="switchMainTab('feed', this)"><span class="ico">🏠</span>الرئيسية</button>
  <button class="b-nav-btn" onclick="showToast('🔍 اسحب لأعلى ولاسفل لاستكشاف المقاطع')"><span class="ico">🔍</span>استكشاف</button>
  <button class="b-nav-btn" onclick="toggleAdminPanel(true)"><span class="ico">➕</span>نشر عمل</button>
  <button class="b-nav-btn" onclick="showToast('👤 حساب المسؤول Nexora VIP')"><span class="ico">👤</span>حسابي</button>
</nav>

<div id="toastAlert">تنبيه</div>

<script>
// البيانات الافتراضية لأفلام وأنمي بستايل تيك توك
let defaultFeeds = [
  { id: 1, title: "Suzume - لقطة حصرية", desc: "أجمل مشاهد فيلم الأنمي الجديد مترجم وبجودة عالية ⚡", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", poster: "", likes: 1420 },
  { id: 2, title: "Demon Slayer - نارية", desc: "حماس المعركة الأسطورية بين الحطاب والشياطين 🔥", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4", poster: "", likes: 3890 },
  { id: 3, title: "Solo Leveling - المانهوا الأسطورية", desc: "لحظة استيقاظ الصياد جين وو وتحوله الكامل 😎", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4", poster: "", likes: 5120 }
];

let feedData = JSON.parse(localStorage.getItem('nexora_tiktok_feeds')) || defaultFeeds;

document.addEventListener('DOMContentLoaded', () => {
  renderFeed();
});

function saveStorage() {
  localStorage.setItem('nexora_tiktok_feeds', JSON.stringify(feedData));
}

function renderFeed() {
  const container = document.getElementById('videoFeedContainer');
  container.innerHTML = '';

  feedData.forEach(item => {
    container.innerHTML += `
      <div class="feed-item">
        <video src="${item.video}" autoplay loop muted playsinline></video>
        <div class="feed-overlay">
          <span class="feed-badge">Nexora Exclusive</span>
          <div class="feed-title">${item.title}</div>
          <div class="feed-desc">${item.desc}</div>
        </div>
        <div class="right-actions">
          <button class="action-btn-item" onclick="toggleLike(this, ${item.id})">❤️<span>${item.likes}</span></button>
          <button class="action-btn-item" onclick="showToast('💬 تم فتح نافذة التعليقات')">💬<span>تعليق</span></button>
          <button class="action-btn-item" onclick="shareWork('${item.title}')">🔗<span>مشاركة</span></button>
          <button class="action-btn-item" onclick="deleteFeedItem(${item.id})" style="background: rgba(239, 68, 68, 0.4);">🗑️<span>حذف</span></button>
        </div>
      </div>
    `;
  });
}

function toggleLike(btn, id) {
  btn.classList.toggle('liked');
  let item = feedData.find(i => i.id === id);
  if(item) {
    if(btn.classList.contains('liked')) item.likes++;
    else item.likes--;
    saveStorage();
    renderFeed();
  }
}

function toggleAdminPanel(show) {
  document.getElementById('adminPanel').style.display = show ? 'flex' : 'none';
}

function addNewFeedItem() {
  let title = document.getElementById('admTitle').value.trim();
  let desc = document.getElementById('admDesc').value.trim();
  let video = document.getElementById('admVideoUrl').value.trim() || "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4";

  if(!title) {
    showToast("⚠️ يرجى إدخال عنوان العمل!");
    return;
  }

  let newObj = {
    id: Date.now(),
    title,
    desc: desc || "تم النشر عبر لوحة تحكم Nexora الإدارية.",
    video,
    likes: 1
  };

  feedData.unshift(newObj);
  saveStorage();
  renderFeed();
  toggleAdminPanel(false);

  document.getElementById('admTitle').value = '';
  document.getElementById('admDesc').value = '';
  document.getElementById('admVideoUrl').value = '';
  showToast("🚀 تمت إضافة الفيديو بنجاح وظهر في تيار تيك توك!");
}

function deleteFeedItem(id) {
  if(confirm("هل أنت متأكد من حذف هذا الفيديو نهائياً؟")) {
    feedData = feedData.filter(i => i.id !== id);
    saveStorage();
    renderFeed();
    showToast("🗑️ تم الحذف بنجاح");
  }
}

function shareWork(title) {
  showToast(`🔗 تم نسخ رابط "${title}" بنجاح!`);
}

function showToast(msg) {
  let t = document.getElementById('toastAlert');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function switchMainTab(tab, btn) {
  document.querySelectorAll('.b-nav-btn').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}
</script>

</body>
</html>
