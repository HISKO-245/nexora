<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora - المشاهدة</title>

<style>
body {
  margin: 0;
  background: #09090e;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px 15px;
  text-align: center;
}

.watch-box {
  max-width: 800px;
  margin: auto;
  background: #12121c;
  border-radius: 16px;
  padding: 20px;
  border: 1px solid #222235;
}

.video-container {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  margin: 15px 0;
}

.video-container iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.back-btn {
  display: inline-block;
  margin-top: 15px;
  padding: 10px 20px;
  background: #8b5cf6;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="watch-box">
  <h1 id="videoTitle">عنوان العرض</h1>
  <div class="rating" id="videoRating">⭐ --</div>

  <div class="video-container">
    <iframe id="videoPlayer" allowfullscreen></iframe>
  </div>

  <a class="back-btn" href="index.html">← العودة للرئيسية</a>
</div>

<script>
const currentItem = JSON.parse(localStorage.getItem('nexora_current_item'));

if (currentItem) {
  document.getElementById('videoTitle').innerText = currentItem.title;
  document.getElementById('videoRating').innerText = "⭐ " + currentItem.rating;
  document.getElementById('videoPlayer').src = currentItem.source;
}
</script>

</body>
</html>
