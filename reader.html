<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora - قارئ المانجا</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #08080c; color: white; font-family: Arial, sans-serif; }

header {
  padding: 15px;
  background: #11111a;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #222235;
}

.reader-container {
  max-width: 750px;
  margin: auto;
  padding-bottom: 80px;
}

.reader-container img {
  width: 100%;
  display: block;
  margin-bottom: 2px;
}

.bottom-controls {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  background: #11111a;
  border: 1px solid #8b5cf6;
  border-radius: 30px;
  padding: 8px 25px;
  display: flex;
  gap: 20px;
  align-items: center;
  box-shadow: 0 5px 20px rgba(0,0,0,0.8);
}

.bottom-controls a {
  color: white;
  text-decoration: none;
  font-size: 20px;
}
</style>
</head>

<body>

<header>
  <h2 id="mangaTitle">جاري التحميل...</h2>
</header>

<div class="reader-container" id="pagesContainer"></div>

<div class="bottom-controls">
  <a href="index.html">🏠 الرئيسية</a>
  <a href="javascript:history.back()">🔙 العودة</a>
</div>

<script>
const currentItem = JSON.parse(localStorage.getItem('nexora_current_item'));

if (currentItem) {
  document.getElementById('mangaTitle').innerText = currentItem.title;
  const container = document.getElementById('pagesContainer');
  const pages = currentItem.source.split(',');

  container.innerHTML = pages.map(url => `<img src="${url.trim()}" alt="Page">`).join('');
} else {
  document.getElementById('pagesContainer').innerHTML = '<p style="text-align:center; padding:50px;">لم يتم العثور على محتوى.</p>';
}
</script>

</body>
</html>
