<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora - قارئ</title>
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: #12121b;
  border-top: 1px solid #29253d;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.bottom-bar a {
  color: white;
  text-decoration: none;
  font-size: 25px;
}
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  text-align: center;
  background: #12121b;
  border-bottom: 1px solid #29253d;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.logo span {
  color: #8b5cf6;
}

.reader {
  max-width: 700px;
  margin: auto;
  padding: 20px 12px 90px;
}

.title {
  text-align: center;
  font-size: 22px;
  margin-bottom: 20px;
}

.page {
  width: 100%;
  min-height: 500px;
  margin-bottom: 12px;
  border-radius: 12px;
  background: linear-gradient(135deg, #24143f, #151522);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 70px;
}

.back {
  display: block;
  width: fit-content;
  margin: 25px auto;
  padding: 12px 22px;
  background: #8b5cf6;
  color: white;
  text-decoration: none;
  border-radius: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Nexo<span>ra</span></div>
</header>

<div class="reader">

  <h1 class="title">📖 قارئ المانهوا</h1>

<div class="page">
  <img src="page1.jpg" alt="صفحة 1">
</div>

<div class="page">
  <img src="page2.jpg" alt="صفحة 2">
</div>

<div class="page">
  <img src="page3.jpg" alt="صفحة 3">
</div>

<div class="page">
  <img src="page4.jpg" alt="صفحة 4">
</div>

<div class="page">
  <img src="page5.jpg" alt="صفحة 5">
</div>

<div class="bottom-bar">
  <a href="#top">⬆️</a>
  <a href="index.html">🏠</a>
  <a href="javascript:history.back()">🔙</a>
</div>

</div>
<script>
const params = new URLSearchParams(window.location.search);
const title = params.get("title");

if (title) {
  document.querySelector(".title").textContent = "📖 " + title;
}
</script>
</body>
</html>
