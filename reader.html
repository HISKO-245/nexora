<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قارئ الفصول - Nexora</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  user-select: none;
}

body {
  background: #09090e;
  color: #efefef;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header Navbar */
.reader-header {
  position: sticky;
  top: 0;
  background: rgba(17, 17, 26, 0.95);
  backdrop-filter: blur(8px);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #1e1e2d;
  z-index: 100;
}

.back-btn {
  background: #161622;
  border: 1px solid #222232;
  color: #efefef;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.chapter-info {
  text-align: center;
}

.chapter-title {
  font-size: 14px;
  font-weight: bold;
  color: #ffffff;
}

.chapter-sub {
  font-size: 10px;
  color: #8b5cf6;
}

/* Content Area */
.reader-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
}

/* Video Viewer */
.video-box {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border: none;
}

/* Image Viewer (Manga/Manhwa) */
.manga-pages {
  width: 100%;
  display: flex;
  flex-direction: column;
}

.manga-pages img {
  width: 100%;
  height: auto;
  display: block;
}

/* Fallback / External Webview */
.iframe-box {
  width: 100%;
  height: calc(100vh - 120px);
  border: none;
}

/* Bottom Controls */
.reader-footer {
  position: sticky;
  bottom: 0;
  background: #11111a;
  border-top: 1px solid #1e1e2d;
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-btn {
  background: #8b5cf6;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

.nav-btn:disabled {
  background: #222232;
  color: #71717a;
  cursor: not-allowed;
}
</style>
</head>
<body>

<!-- Reader Header -->
<div class="reader-header">
  <button class="back-btn" onclick="window.history.back()">✕</button>
  <div class="chapter-info">
    <div class="chapter-title" id="readTitle">عنوان العمل</div>
    <div class="chapter-sub" id="readChapter">الفصل 1</div>
  </div>
  <button class="back-btn" onclick="alert('تم حفظ الإشارة المرجعية')">🔖</button>
</div>

<!-- Main Reader Display -->
<div class="reader-container" id="readerContainer">
  <div style="padding: 40px; text-align: center; color: #a1a1aa;">جاري تحميل المحتوى...</div>
</div>

<!-- Footer Navigation -->
<div class="reader-footer">
  <button class="nav-btn" onclick="prevChapter()">الفصل السابق</button>
  <span style="font-size: 12px; color: #a1a1aa;" id="pageIndicator">1 / 1</span>
  <button class="nav-btn" onclick="nextChapter()">الفصل التالي</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const data = localStorage.getItem('selected_manga');
  const container = document.getElementById('readerContainer');
  
  if (data) {
    const item = JSON.parse(data);
    document.getElementById('readTitle').innerText = item.title || "عرض العمل";
    
    const url = item.videoUrl || "";

    if (!url) {
      container.innerHTML = `
        <div style="text-align: center; padding: 40px 20px;">
          <div style="font-size: 40px; margin-bottom: 10px;">📄</div>
          <p style="color: #a1a1aa;">لم يتم إضافة رابط القراءة أو المشاهدة لهذا العمل بعد.</p>
        </div>
      `;
      return;
    }

    // إذا كان الرابط فيديو مباشر أو Embed
    if (url.includes('youtube') || url.includes('embed') || url.endsWith('.mp4')) {
      container.innerHTML = `<iframe class="video-box" src="${url}" allowfullscreen></iframe>`;
    } 
    // إذا كان الرابط الخارجي موقع قراءة أو رابط فصل
    else {
      container.innerHTML = `<iframe class="iframe-box" src="${url}"></iframe>`;
    }
  } else {
    container.innerHTML = `<div style="padding: 40px; color: #ef4444;">لم يتم العثور على بيانات العمل.</div>`;
  }
});

function prevChapter() {
  alert("أنت في الفصل الأول حالياً");
}

function nextChapter() {
  alert("هذا هو أحدث فصل متوفر حالياً");
}
</script>

</body>
</html>
