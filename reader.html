<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora - قارئ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  text-align: center;
  background: #12121b;
  border-bottom: 1px solid #29253d;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.logo span {
  color: #8b5cf6;
}

.reader {
  max-width: 700px;
  margin: auto;
  padding: 20px 12px 100px;
}

.title {
  text-align: center;
  font-size: 22px;
  margin-bottom: 20px;
}

.page {
  width: 100%;
  margin-bottom: 12px;
  border-radius: 12px;
  overflow: hidden;
}

.page img {
  width: 100%;
  height: auto;
  display: block;
}

.bottom-bar {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  height: 70px;
  background: #12121b;
  border: 1px solid #29253d;
  border-radius: 20px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 9999;
}

.bottom-bar a {
  color: white;
  text-decoration: none;
  font-size: 32px;
}
</style>
</head>

<body>

<header>
  div class="logo">Nexo<span>ra</span></div>
</header>

<div class="reader">

  <h1 class="title">📖 قارئ المانهوا</h1>

  <div class="page">
    <img src="https://placeholdpicsum.dev/photo/id/1/700/1000" alt="صفحة 1">
  </div>

  <div class="page">
    <img src="https://placeholdpicsum.dev/photo/id/2/700/1000" alt="صفحة 2">
  </div>

  <div class="page">
    <img src="https://placeholdpicsum.dev/photo/id/3/700/1000" alt="صفحة 3">
  </div>

  <div class="page">
    <img src="https://placeholdpicsum.dev/photo/id/4/700/1000" alt="صفحة 4">
  </div>

  <div class="page">
    <img src="https://placeholdpicsum.dev/photo/id/5/700/1000" alt="صفحة 5">
  </div>

</div>

<div class="bottom-bar">
  <a href="#">⬆️</a>
  <a href="index.html">🏠</a>
  <a href="javascript:history.back()">🔙</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const title = params.get("title");

if (title) {
  document.querySelector(".title").textContent = "📖 " + title;
}
</script>

</body>
</html>
