<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- خلفية التدرج الداكن -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090e" />
    </radialGradient>

    <!-- تدرج حرف N الأرجواني -->
    <linearGradient id="n-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- توهج النيون -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- خلفية الأيقونة (Dark Squircle) -->
  <rect width="512" height="512" rx="120" fill="url(#bg-glow)" stroke="#2e1065" stroke-width="6"/>

  <!-- تأثير خلفي نيون -->
  <path d="M160 370 V 142 L 310 320 V 142 H 352 V 370 L 202 192 V 370 Z" fill="#8b5cf6" opacity="0.3" filter="url(#neon-glow)" />

  <!-- حرف N الرئيسي -->
  <path d="M160 370 V 142 L 310 320 V 142 H 352 V 370 L 202 192 V 370 Z" fill="url(#n-gradient)" />

  <!-- نجمة Nexora الذهبية -->
  <path d="M370 120 L376 138 L394 144 L376 150 L370 168 L364 150 L346 144 L364 138 Z" fill="#facc15" />
</svg>
